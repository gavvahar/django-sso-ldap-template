name: Code Quality

on:
  push:
  pull_request:

jobs:
  quality:
    permissions:
      contents: read
    uses: $/.github/workflows/tox-check-reusable.yml
    with:
      tox_env: github

  django-tests:
    permissions:
      contents: read
    uses: $/.github/workflows/tox-check-reusable.yml
    with:
      tox_env: test
      # python-ldap is a C extension with no wheels on PyPI; it builds against
      # OpenLDAP's headers. See docs/ldap.md.
      system_packages: libldap2-dev libsasl2-dev
