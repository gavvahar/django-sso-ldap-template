name: Tox check (reusable)

on:
  workflow_call:
    inputs:
      tox_env:
        required: true
        type: string
      system_packages:
        description: Space-separated apt packages to install before running tox.
        required: false
        default: ""
        type: string

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install system packages
        if: inputs.system_packages != ''
        env:
          INPUTS_SYSTEM_PACKAGES: ${{ inputs.system_packages }}
        run: |
          sudo apt-get update
          # Unquoted on purpose: the input is a space-separated package list.
          # shellcheck disable=SC2086
          sudo apt-get install -y --no-install-recommends $INPUTS_SYSTEM_PACKAGES

      - name: Set up Python3
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
          cache: "pip"

      - name: Install tox
        run: |
          python -m pip install --upgrade pip
          pip install tox

      - name: Run tox (${{ inputs.tox_env }})
        env:
          INPUTS_TOX_ENV: ${{ inputs.tox_env }}
        run: tox -e "${INPUTS_TOX_ENV}"
